server.port=8090

spring.application.name=simpleDao

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:notebook}
spring.datasource.username=${POSTGRES_USER:notebook}
spring.datasource.password=${POSTGRES_PASSWORD:notebook}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# После того как Hibernate создаст таблицы — добавляем комментарии и VIEW с русскими подписями столбцов (Adminer/pgAdmin).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/postgres-ui-help.sql

spring.thymeleaf.cache=false

spring.h2.console.enabled=false
